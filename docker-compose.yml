# Local development only. Credentials here are local placeholders, not secrets.
services:
  # Persistent development database.
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: trb
      POSTGRES_PASSWORD: trb
      POSTGRES_DB: trb_dev
    ports:
      - '127.0.0.1:5434:5432'
    volumes:
      - postgres-dev:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U trb -d trb_dev']
      interval: 2s
      timeout: 3s
      retries: 30

  # Disposable test server: in-memory storage, separate port, nothing survives a restart.
  # Integration tests create and drop one database per run on this server.
  postgres-test:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: trb
      POSTGRES_PASSWORD: trb
      POSTGRES_DB: postgres
    command:
      ['postgres', '-c', 'fsync=off', '-c', 'synchronous_commit=off', '-c', 'full_page_writes=off']
    ports:
      - '127.0.0.1:5433:5432'
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U trb -d postgres']
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  postgres-dev:
